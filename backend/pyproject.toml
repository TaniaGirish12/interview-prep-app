[project]
name = "interview-prep-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=2.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "lxml>=5.0",
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "fpdf2>=2.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
